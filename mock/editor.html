<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mock Block Editor (demo)</title>
<!-- Minimal stand-in for the WordPress block editor (Gutenberg): same aria labels and
     class names the agent targets, a welcome dialog that must be dismissed, a
     paste handler, Save draft and a two-stage Publish. State: window.__mockState -->
<style>
  body { font-family: system-ui, sans-serif; margin: 0; }
  header { display: flex; gap: 8px; justify-content: flex-end; padding: 10px 16px; border-bottom: 1px solid #ddd; }
  .canvas { max-width: 760px; margin: 30px auto; }
  .editor-post-title__input { font-size: 2.2em; outline: none; min-height: 1.2em; border-bottom: 1px dashed #ccc; }
  .is-root-container { min-height: 200px; margin-top: 20px; }
  .is-root-container p[contenteditable] { min-height: 1.4em; outline: 1px dashed #ddd; }
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: flex; align-items: center; justify-content: center; }
  .overlay > div { background: #fff; padding: 24px; border-radius: 8px; width: 380px; }
  .editor-post-publish-panel { position: fixed; top: 0; right: 0; width: 300px; height: 100%; background: #fff;
                               border-left: 1px solid #ddd; padding: 16px; }
</style>
</head>
<body>
<header>
  <button type="button" class="editor-post-save-draft">Save draft</button>
  <span class="editor-post-saved-state" hidden>Saved</span>
  <button type="button" class="editor-post-publish-panel__toggle">Publish</button>
</header>
<div class="canvas">
  <h1 class="editor-post-title__input" contenteditable="true" role="textbox" aria-label="Add title"></h1>
  <div class="is-root-container" id="editor-body">
    <p contenteditable="true" role="document" class="block-editor-rich-text__editable"
       aria-label="Empty block; start writing or type forward slash to choose a block"></p>
  </div>
</div>
<div class="overlay" id="welcome">
  <div role="dialog" aria-label="Welcome to the block editor">
    <h2>Welcome to the block editor</h2>
    <p>(Mock) In the real editor this guide appears on first use.</p>
    <button type="button" aria-label="Close">×</button>
  </div>
</div>
<div class="editor-post-publish-panel" role="region" aria-label="Editor publish" hidden>
  <div id="panel-body">
    <p>Are you ready to publish?</p>
    <div class="editor-post-publish-panel__header-publish-button">
      <button type="button" class="editor-post-publish-button">Publish</button>
    </div>
  </div>
</div>
<script>
const $ = (s) => document.querySelector(s);
const state = window.__mockState = { title: '', html: '', status: 'new', pasteCount: 0 };
const title = $('.editor-post-title__input'), body = $('#editor-body');

$('#welcome button').onclick = () => $('#welcome').remove();
title.addEventListener('input', () => { state.title = title.innerText.trim(); });
title.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') { e.preventDefault(); body.querySelector('p, [contenteditable]').focus(); }
});
body.addEventListener('paste', (e) => {
  e.preventDefault();
  const html = e.clipboardData.getData('text/html');
  const text = e.clipboardData.getData('text/plain');
  body.innerHTML = html || text.split(/\n\n+/).map(p => `<p>${p}</p>`).join('');
  state.html = body.innerHTML; state.pasteCount++;
});
$('.editor-post-save-draft').onclick = () => {
  state.status = 'draft';
  $('.editor-post-save-draft').hidden = true;
  const saved = $('.editor-post-saved-state'); saved.hidden = false; saved.classList.add('is-saved');
  history.replaceState(null, '', location.pathname + '?post=42&action=edit');
};
$('.editor-post-publish-panel__toggle').onclick = () => { $('.editor-post-publish-panel').hidden = false; };
$('.editor-post-publish-button').onclick = () => {
  state.status = 'publish';
  $('#panel-body').innerHTML = `<p><strong>${title.innerText}</strong> is now live.</p>`;
};
</script>
</body>
</html>
